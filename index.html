<style>
:root{
  --bg:#dee3e7;--surface:#fff;--ink:#1e2830;--muted:#5c6975;--line:#c4ccd3;--accent:#2d49d6;--on-accent:#fff;
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2026;--surface:#262d35;--ink:#e6eaee;--muted:#94a0ab;--line:#38424c;--accent:#8fa4ff;--on-accent:#10162e}}
:root[data-theme="dark"]{--bg:#1b2026;--surface:#262d35;--ink:#e6eaee;--muted:#94a0ab;--line:#38424c;--accent:#8fa4ff;--on-accent:#10162e}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 64px}
header{display:flex;flex-wrap:wrap;align-items:end;gap:16px 24px;justify-content:space-between}
h1{margin:0;font-size:clamp(1.9rem,5.2vw,3.4rem);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.sub{margin:8px 0 0;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{min-width:220px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger[data-sure="1"]{background:#b3261e;border-color:#b3261e;color:#fff}
.btn:hover{border-color:var(--accent)}
nav{display:flex;gap:8px;overflow-x:auto;padding:22px 0 18px;margin:0;scrollbar-width:thin}
.chip{flex:none;cursor:pointer;border:1px solid var(--line);background:transparent;padding:7px 14px;border-radius:999px}
.chip span{color:var(--muted);margin-left:6px;font-size:.88em}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] span{color:inherit;opacity:.7}
.grid{column-width:250px;column-gap:18px}
.card{break-inside:avoid;margin:0 0 18px;background:var(--surface);padding:10px 10px 0;border-radius:3px;position:relative;box-shadow:0 1px 0 var(--line)}
.card .open{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.card:hover,.card:focus-within{z-index:5;box-shadow:0 18px 36px rgba(10,20,30,.28)}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s}.card:hover,.card:focus-within{transform:scale(1.07) translateY(-5px)}}
.card img{display:block;width:100%;height:auto;background:var(--line)}
.cap{display:flex;justify-content:space-between;gap:8px;padding:9px 2px 11px;font-size:.9rem}
.cap b{font-weight:600}
.cap time{color:var(--muted);white-space:nowrap}
.desc{margin:-4px 0 0;padding:0 2px 12px;color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fav{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.85);color:#1e2830;font-size:18px;line-height:1}
.fav[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.empty{padding:64px 16px;text-align:center;color:var(--muted);max-width:46ch;margin:0 auto}
.empty strong{display:block;color:var(--ink);font-size:1.3rem;margin-bottom:6px}
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);max-width:min(96vw,1180px);max-height:96vh;width:100%;border-radius:4px;overflow:auto}
dialog::backdrop{background:rgba(10,14,18,.82)}
.lb{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;padding:14px}
.stage{display:grid;place-items:center;background:var(--bg);min-height:200px}
.stage img{display:block;max-width:100%;max-height:80vh;object-fit:contain}
.side{display:flex;flex-direction:column;gap:12px}
.side label{display:block;font-size:.85rem;color:var(--muted)}
.side input,.side textarea{display:block;width:100%;margin-top:3px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.side textarea{min-height:150px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px}
.pos{color:#8b97a2;font-size:.9rem;margin:0}
dialog{background:#12171c;color:#e9edf1;max-width:min(97vw,1240px);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(6,9,12,.88);backdrop-filter:blur(6px)}

.stage{background:#0b0e11;min-height:320px;padding:22px;position:relative}
.stage img{max-height:84vh;border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;font-size:24px;line-height:1}
.nav:hover{background:rgba(255,255,255,.3)}
.nav.l{left:12px}.nav.r{right:12px}
.side{padding:24px 22px;gap:16px;background:#12171c}
.side h2{margin:0;font-size:1.65rem;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.about{margin:12px 0 0;color:#c3ccd5;white-space:pre-wrap;line-height:1.6}
.about.none{color:#7b8791;font-style:italic}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.92rem;padding:14px 0;border-block:1px solid #2a333c}
.facts dt{color:#8b97a2}.facts dd{margin:0;text-align:right}
.side .btn{background:#1c242c;border-color:#303b46;color:#e9edf1}
.side .btn.primary{background:#8fa4ff;border-color:#8fa4ff;color:#10162e}
.side label{color:#8b97a2}
.side input,.side textarea{background:#0b0e11;border-color:#303b46;color:#e9edf1}
#edit{display:flex;flex-direction:column;gap:12px}
#view[hidden],#edit[hidden]{display:none}
dialog{max-width:min(97vw,1400px)}
.lb{grid-template-columns:minmax(0,1fr) 460px;transition:grid-template-columns .35s cubic-bezier(.2,.7,.3,1)}
.lb.noinfo{grid-template-columns:minmax(0,1fr) 0px}
.side{padding:34px 30px;gap:22px;overflow:hidden;min-width:0}
.side h2{font-size:2.3rem;line-height:1.1}
.about{font-size:1.12rem;line-height:1.7;margin-top:16px}
.facts{font-size:1.05rem;gap:0 18px;padding:4px 0}
.facts dt,.facts dd{padding:12px 0;border-bottom:1px solid #222b34}
.facts dd{font-weight:600}
.side .btn{padding:12px 20px;font-size:1rem}
.side input,.side textarea{font-size:1.05rem;padding:12px 14px}
.side textarea{min-height:200px}
.about{font-size:1.5rem;line-height:1.55;color:#fff;font-weight:500;margin-top:18px;padding:18px 20px;background:rgba(143,164,255,.12);border-left:4px solid #8fa4ff;border-radius:0 10px 10px 0}
.about.none{font-size:1.1rem;font-weight:400;color:#7b8791;background:transparent;border-left-color:#303b46}
@media (max-width:780px){.about{font-size:1.25rem}}
.card .open{position:relative;overflow:hidden}
.ov{display:none}
@media (hover:hover){.desc{display:none}.ov{display:block;position:absolute;left:0;right:0;bottom:0;max-height:100%;overflow:hidden;padding:48px 14px 14px;background:linear-gradient(transparent,rgba(5,8,11,.9));color:#fff;font-size:1rem;line-height:1.45;text-align:left;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}.card:hover .ov,.card:focus-within .ov{opacity:1;transform:none}}
.frame{position:relative;display:inline-block;max-width:100%;line-height:0;overflow:hidden;border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.frame img{box-shadow:none;cursor:pointer}
.sdesc{position:absolute;left:0;right:0;bottom:0;padding:70px 26px 24px;background:linear-gradient(transparent,rgba(5,8,11,.9));color:#fff;font-size:1.35rem;line-height:1.5;white-space:pre-wrap;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;pointer-events:none}
.sdesc:empty{display:none}
.stage:hover .sdesc,.stage.showdesc .sdesc{opacity:1;transform:none}
@media (max-width:780px){.sdesc{font-size:1.05rem;padding:48px 16px 16px}}
.lb.noinfo .stage{padding:12px}
.lb.noinfo .frame{width:100%;box-shadow:none}
.lb.noinfo .stage img{width:100%;height:88vh;max-height:none;object-fit:contain}
@media (max-width:780px){.lb.noinfo .stage img{height:76vh}}
nav{position:sticky;top:0;z-index:6;margin:0;padding:12px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px}
.mon{grid-column:1/-1;position:sticky;top:60px;z-index:4;margin:0;padding:20px 2px 8px;font-size:1.5rem;font-weight:800;letter-spacing:-.01em;background:linear-gradient(var(--bg) 70%,transparent)}
.card{margin:0;padding:0;border-radius:8px;background:var(--line)}
.card .open{aspect-ratio:1/1;border-radius:8px}
.card img{width:100%;height:100%;object-fit:cover}
.cap{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 8px;color:#fff;font-size:.85rem;background:linear-gradient(transparent,rgba(5,8,11,.78));border-radius:0 0 8px 8px;opacity:0;transition:opacity .2s;pointer-events:none}
.cap time{color:#d3dae0}
.card:hover .cap,.card:focus-within .cap{opacity:1}
.desc{display:none}
.fav{top:8px;right:8px;opacity:0;transition:opacity .2s}
.card:hover .fav,.card:focus-within .fav,.fav[aria-pressed="true"]{opacity:1}
@media (hover:hover){.ov{padding-bottom:46px;font-size:.85rem}}
@media (hover:none){.cap,.fav{opacity:1}}
.card.rv{opacity:0;transform:translateY(30px) scale(.94);transition:opacity .6s ease var(--d,0s),transform .6s cubic-bezier(.2,.8,.3,1) var(--d,0s)}
.card.rv.in{opacity:1;transform:none}
.prog{position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);z-index:30;pointer-events:none}
.totop{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;background:var(--ink);color:var(--bg);font-size:20px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s,transform .25s;z-index:15}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.infoBtn{position:absolute;top:14px;left:14px;z-index:2;border:0;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;padding:9px 16px;border-radius:999px;font-weight:600}
.infoBtn:hover{background:rgba(255,255,255,.3)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes beat{40%{transform:scale(1.16)}}
@media (prefers-reduced-motion:no-preference){
dialog[open]{animation:pop .35s cubic-bezier(.2,.8,.3,1)}
dialog[open]::backdrop{animation:fade .3s}
.anim .stage img{animation:fade .45s}
.anim .side>*{animation:rise .5s cubic-bezier(.2,.8,.3,1) both}
.anim .side>:nth-child(2){animation-delay:.06s}.anim .side>:nth-child(3){animation-delay:.12s}.anim .side>:nth-child(4){animation-delay:.18s}.anim .side>:nth-child(5){animation-delay:.24s}
.side .btn,.nav{transition:transform .15s,background .15s}
.side .btn:hover{transform:translateY(-2px)}
.nav:hover{transform:translateY(-50%) scale(1.12)}
.facts dt,.facts dd{transition:color .15s}
.facts dt:hover,.facts dt:hover+dd{color:#fff}
#lbfav.pulse{animation:beat .4s}
}

@media (prefers-reduced-motion:no-preference){.welcome{animation:welcomeIn .7s cubic-bezier(.2,.8,.3,1) both}@keyframes welcomeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:drop-shadow(0 0 3px rgba(255,255,255,.5))}}
#editBtn,#replace,#del,#pub{display:none}
body.drafting #pub{display:inline-block}
body.drafting #lbfav,body.drafting .nav,body.drafting .infoBtn{display:none}
body{overflow-x:clip}
.lbl{display:none}
@media (hover:hover){
.card:hover img,.card:focus-within img{object-fit:contain;background:#0b0e11}
.card:hover,.card:focus-within{transform:scale(1.35)}
.ov{display:none!important}

.card:hover .lbl,.card:focus-within .lbl{opacity:1}
.lbl .cap{position:static;display:flex;padding:0;background:none;opacity:1;border-radius:0}
.lbl .desc{display:-webkit-box;margin:4px 0 0;padding:0;color:#d3dae0;font-size:.85rem;-webkit-line-clamp:4}
}
@media (hover:none){.lbl{display:block;position:absolute;left:0;right:0;bottom:0}.lbl .cap{position:static;padding:26px 10px 8px;background:linear-gradient(transparent,rgba(5,8,11,.78));border-radius:0 0 8px 8px;opacity:1}.lbl .desc{display:none}}
@media (hover:hover){.card:hover img,.card:focus-within img{object-fit:cover}.card:hover,.card:focus-within{transform:scale(1.04)}.lbl{display:none!important}}
#peek{position:fixed;z-index:50;display:none;background:#0b0e11;color:#fff;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.6);overflow:hidden;pointer-events:none}

#peek p:empty{display:none}
</style>

const SB='PASTE_YOUR_PROJECT_URL_HERE',KEY='PASTE_YOUR_ANON_KEY_HERE',H=KEY.startsWith('sb_')?{apikey:KEY}:{apikey:KEY,Authorization:'Bearer '+KEY};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function scene(kind,seed,w,h){
  const r=rng(seed),H=(x,s,l)=>`hsl(${x},${s}%,${l}%)`,sh=(r()-.5)*24;
  const pal={coast:[205,30],mountains:[215,35],city:[262,15],night:[235,250],forest:[150,60]}[kind]||[200,30];
  const dark=kind==='night';
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${H(pal[0]+sh,dark?50:kind==='city'?45:60,dark?8:kind==='city'?38:70)}"/><stop offset="1" stop-color="${H(pal[1]+sh,dark?40:85,dark?24:kind==='city'?64:84)}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g)"/>`;
  const ridge=(base,amp,col)=>{let p=`M0,${h}L0,${base}`;const n=14;for(let i=1;i<=n;i++)p+=`L${(w/n*i).toFixed(0)},${(base+(r()-.5)*amp).toFixed(0)}`;return `<path d="${p}L${w},${h}Z" fill="${col}"/>`};
  if(dark){for(let i=0;i<70;i++)s+=`<circle cx="${r()*w|0}" cy="${r()*h*.6|0}" r="${(r()*1.6+.4).toFixed(1)}" fill="#fff" opacity="${(r()*.7+.3).toFixed(2)}"/>`;
    s+=`<circle cx="${w*(.25+r()*.5)|0}" cy="${h*.22|0}" r="${w*.07|0}" fill="#f4efd9"/>`;
    s+=ridge(h*.72,h*.12,H(240,30,10))+ridge(h*.86,h*.1,H(240,35,5));}
  else if(kind==='coast'){const sy=h*.55;s+=`<circle cx="${w*(.3+r()*.4)|0}" cy="${sy-h*.06|0}" r="${w*.09|0}" fill="#fff3d6" opacity=".9"/>`;
    for(let i=0;i<6;i++){const y=sy+i*(h*.4/6);s+=`<rect y="${y|0}" width="${w}" height="${(h*.4/6+1)|0}" fill="${H(200+sh/2,55,48-i*4)}"/>`;s+=`<rect x="${r()*w*.6|0}" y="${(y+6)|0}" width="${w*.3|0}" height="2" fill="#fff" opacity=".35"/>`}
    s+=ridge(h*.9,h*.05,H(38,45,78));}
  else if(kind==='mountains'){s+=`<circle cx="${w*.7|0}" cy="${h*.28|0}" r="${w*.06|0}" fill="#fff6e0"/>`;
    [[.5,.3,H(220,25,72)],[.6,.25,H(222,28,56)],[.72,.22,H(225,30,40)],[.85,.16,H(228,34,24)]].forEach(a=>s+=ridge(h*a[0],h*a[1],a[2]));}
  else if(kind==='city'){let x=0;while(x<w){const bw=w*(.06+r()*.09),bh=h*(.25+r()*.45);s+=`<rect x="${x|0}" y="${(h-bh)|0}" width="${bw|0}" height="${bh|0}" fill="${H(250,30,12+r()*8)}"/>`;
      for(let wy=h-bh+10;wy<h-8;wy+=16)for(let wx=x+6;wx<x+bw-8;wx+=14)if(r()>.55)s+=`<rect x="${wx|0}" y="${wy|0}" width="6" height="8" fill="${H(45,90,70)}"/>`;x+=bw+2}}
  else{s+=`<rect y="${h*.5|0}" width="${w}" height="${h*.5|0}" fill="${H(150,30,60)}" opacity=".4"/>`;
    [[.55,H(150,35,40),.14],[.7,H(150,40,28),.18],[.9,H(155,45,16),.24]].forEach(a=>{const n=7;for(let i=0;i<n;i++){const tw=w*a[2]*(.8+r()*.4),cx=(i+r())*w/n,th=h*(.28+r()*.2),by=h*a[0]+h*.2;s+=`<path d="M${cx-tw/2|0},${by|0}L${cx|0},${(by-th)|0}L${cx+tw/2|0},${by|0}Z" fill="${a[1]}"/>`}});
    s+=`<rect y="${h*.8|0}" width="${w}" height="${h*.2|0}" fill="${H(155,45,12)}"/>`;}
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s+'</svg>');
}
const titles={coast:['Low tide, north shore','Salt and sunrise','The long jetty','Evening swell'],mountains:['First light on the ridge','Three ranges deep','Above the cloud line','Summit road'],city:['Rooftops after rain','Last train home','Office lights at dusk','Crosswalk, 7 pm'],night:['Moon over the pass','Clear sky, no wind','Campsite at midnight','Stars from the field'],forest:['Fog between the pines','Trail marker 14','Morning in the grove','Where the path bends']};
const sizes=[[600,800],[800,600],[800,800],[600,900]];
function defaults(){const a=[];let id=0;Object.keys(titles).forEach((k,ki)=>titles[k].forEach((t,i)=>{if(['coast','mountains','city','night','forest'].includes(k))return;const sz=sizes[(ki+i)%4],seed=ki*10+i+3,m=((seed*7)%12)+1,d=((seed*5)%27)+1;
  a.push({id:id++,kind:k,seed,w:sz[0],h:sz[1],title:t,desc:'',album:k[0].toUpperCase()+k.slice(1),date:`2026-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,fav:false})}));return a}

const MOTION=!matchMedia('(prefers-reduced-motion:reduce)').matches;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const c=e.target;io.unobserve(c);c.classList.add('in');setTimeout(()=>c.classList.remove('rv','in'),900)}}),{rootMargin:'0px 0px -6% 0px'});
let photos=[],nextId=0,album='all',query='',shown=[],cur=-1;
const $=s=>document.getElementById(s);
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('st-agatha',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){try{const d=await idb();return await new Promise((res,rej)=>{const q=d.transaction('s').objectStore('s').get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
let st=0;function save(){clearTimeout(st);st=setTimeout(async()=>{try{const d=await idb();d.transaction('s','readwrite').objectStore('s').put(photos.map(({_src,...r})=>r),'state')}catch(e){}},250)}
const src=p=>p._src||(p._src=p.blob?URL.createObjectURL(p.blob):scene(p.kind,p.seed,p.w,p.h));
const fmt=d=>{try{return new Date(d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}catch(e){return d}};
const inAlbum=(p,a)=>a==='all'||(a==='fav'?p.fav:p.album===a);
function render(){
  const albums=[...new Set(photos.map(p=>p.album).filter(Boolean))];
  if(album!=='all'&&album!=='fav'&&!albums.includes(album))album='all';
  $('albums').innerHTML='';
  [['all','Library'],['fav','Favorites'],...albums.map(a=>[a,a])].forEach(([k,label])=>{
    const b=document.createElement('button');b.className='chip';b.type='button';b.setAttribute('aria-pressed',album===k);
    b.textContent=label;const n=document.createElement('span');n.textContent=photos.filter(p=>inAlbum(p,k)).length;b.appendChild(n);b.onclick=()=>{album=k;render()};$('albums').appendChild(b)});
  $('albumList').innerHTML='';albums.forEach(a=>{const o=document.createElement('option');o.value=a;$('albumList').appendChild(o)});
  const q=query.trim().toLowerCase();
  shown=photos.filter(p=>inAlbum(p,album)&&(!q||(p.title+' '+(p.desc||'')).toLowerCase().includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  $('count').textContent=`${photos.length} photos in ${albums.length} albums. Open any photo to edit its title, description, album and date.`;
  const g=$('grid');g.innerHTML='';
  let lastM='';shown.forEach((p,i)=>{const mk=(p.date||'').slice(0,7);if(mk!==lastM){lastM=mk;const h=document.createElement('h2');h.className='mon';const t=new Date(mk+'-01T00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});h.textContent=/Invalid/.test(t)?'Undated':t;g.appendChild(h)}const c=document.createElement('figure');c.className='card';
    c.innerHTML='<button class="open" type="button"><img loading="lazy" alt=""></button><button class="fav" type="button" aria-label="Favorite"></button><figcaption class="cap"><b></b><time></time></figcaption>';
    const img=c.querySelector('img');img.src=src(p);img.alt=p.title;
    c.querySelector('.open').setAttribute('aria-label','Open '+p.title);
    const f=c.querySelector('.fav');f.setAttribute('aria-pressed',p.fav);f.textContent=p.fav?'♥':'♡';
    c.querySelector('b').textContent=p.title;c.querySelector('time').textContent=fmt(p.date);
    if(p.desc){const d=document.createElement('p');d.className='desc';d.textContent=p.desc;c.appendChild(d);const o=document.createElement('span');o.className='ov';o.textContent=p.desc;c.querySelector('.open').appendChild(o)}
    c.querySelector('.open').onclick=()=>openLb(i);
    f.onclick=()=>{p.fav=!p.fav;save();render()};
    const w=document.createElement('div');w.className='lbl';w.append(...c.querySelectorAll('.cap,.desc'));c.appendChild(w);if(matchMedia('(hover:hover)').matches){c.addEventListener('mouseenter',()=>peekShow(c,p));c.addEventListener('mouseleave',peekHide)}if(MOTION){c.classList.add('rv');c.style.setProperty('--d',(i%6*45)+'ms');io.observe(c)}g.appendChild(c)});
  const e=$('empty');e.hidden=shown.length>0;
  if(!shown.length)e.innerHTML=q?'<strong>No matches</strong>Try a different word, or switch to Library.':album==='fav'?'<strong>No favorites yet</strong>Tap the heart on any photo to keep it here.':'<strong>No photos yet</strong>Choose Add photos, or drop image files anywhere on this page.';
}
let editing=false;
function setEdit(on){editing=on;$('view').hidden=on;$('edit').hidden=!on;$('editBtn').textContent=on?'Done':'Edit details'}
function facts(p,w,h){const sz=p.blob?(p.blob.size>1e6?(p.blob.size/1e6).toFixed(1)+' MB':Math.round(p.blob.size/1e3)+' KB'):'';
  const rows=[['Album',p.album||'Unsorted'],['Date',p.date?fmt(p.date):'Not set'],['Dimensions',w&&h?`${w} × ${h} px`:'Checking'],['Source',p.blob?`${(p.blob.type||'image').replace('image/','').toUpperCase()}, ${sz}`:'Sample illustration']];
  const d=$('facts');d.innerHTML='';rows.slice(0,1).forEach(([k,v])=>{const t=document.createElement('dt'),e=document.createElement('dd');t.textContent=k;e.textContent=v;d.append(t,e)})}
$('editBtn').onclick=()=>{setEdit(!editing);if(editing)$('fDesc').focus();else showLb()};
function pop(){const l=document.querySelector('.lb');l.classList.remove('anim');void l.offsetWidth;l.classList.add('anim')}
$('infoBtn').onclick=()=>{const c=document.querySelector('.lb').classList.toggle('noinfo');$('infoBtn').textContent=c?'Show info':'Hide info';$('infoBtn').setAttribute('aria-pressed',!c)};
function openLb(i){cur=i;setEdit(false);showLb();pop();if(!$('lb').open)$('lb').showModal()}
function showLb(){const p=shown[cur];if(!p)return;const im=$('lbimg');im.onload=()=>facts(p,p.blob?im.naturalWidth:p.w,p.blob?im.naturalHeight:p.h);im.src=src(p);im.alt=p.title;facts(p,p.blob?0:p.w,p.blob?0:p.h);
  $('vTitle').textContent=p.title;$('stageDesc').textContent=p.desc||'';const v=$('vDesc');v.textContent=p.desc||'No description yet. Choose Edit details to add one.';v.classList.toggle('none',!p.desc);
  $('fTitle').value=p.title;$('fDesc').value=p.desc||'';$('fAlbum').value=p.album||'';$('fDate').value=p.date||'';
  $('pos').textContent=`Photo ${cur+1} of ${shown.length}`;$('lbfav').setAttribute('aria-pressed',p.fav);$('lbfav').textContent=p.fav?'Favorited':'Favorite';
  $('del').dataset.sure='';$('del').textContent='Delete'}
function step(d){if(!shown.length)return;cur=(cur+d+shown.length)%shown.length;showLb();pop()}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('close').onclick=()=>$('lb').close();
$('lb').addEventListener('close',render);
$('lb').addEventListener('click',e=>{if(e.target===$('lb'))$('lb').close()});
const bind=(id,key,fb)=>$(id).addEventListener('input',e=>{const p=shown[cur];if(!p)return;p[key]=e.target.value||fb||'';save()});
bind('fTitle','title','Untitled');bind('fDesc','desc');$('fDesc').addEventListener('input',e=>{$('stageDesc').textContent=e.target.value});$('lbimg').onclick=()=>$('lbimg').closest('.stage').classList.toggle('showdesc');bind('fAlbum','album','Unsorted');bind('fDate','date');
$('lbfav').onclick=()=>{const p=shown[cur];p.fav=!p.fav;save();showLb();const f=$('lbfav');f.classList.remove('pulse');void f.offsetWidth;f.classList.add('pulse')};
$('replace').onclick=()=>$('swap').click();
$('swap').onchange=e=>{const f=e.target.files[0],p=shown[cur];e.target.value='';if(!f||!p)return;p.blob=f;delete p._src;save();showLb()};
$('del').onclick=()=>{const b=$('del');if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Click again to delete';return}
  const p=shown[cur];photos=photos.filter(x=>x!==p);save();$('lb').close()};
document.addEventListener('keydown',e=>{if(!$('lb').open||e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight,y=scrollY;$('prog').style.transform='scaleX('+(max>0?y/max:0)+')';$('totop').classList.toggle('on',y>500);if(MOTION){const b=document.querySelector('.brand');b.style.transform='translateY('+Math.min(y*.25,90)+'px)';b.style.opacity=Math.max(0,1-y/380)}},{passive:true});
$('totop').onclick=()=>scrollTo({top:0,behavior:'smooth'});
$('q').oninput=e=>{query=e.target.value;render()};
$('add').onclick=()=>$('file').click();
function addFiles(fs){let n=0;[...fs].forEach(f=>{if(!f.type.startsWith('image/'))return;n++;
  photos.unshift({id:nextId++,blob:f,title:f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' '),desc:'',album:'My uploads',date:new Date(f.lastModified||Date.now()).toISOString().slice(0,10),fav:false})});
  if(n){album='My uploads';query='';$('q').value='';save();render()}}
$('file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
let dc=0;
addEventListener('dragenter',e=>{e.preventDefault();dc++;$('drop').classList.add('on')});
addEventListener('dragleave',()=>{dc=Math.max(0,dc-1);if(!dc)$('drop').classList.remove('on')});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;$('drop').classList.remove('on');addFiles(e.dataTransfer.files)});
(async()=>{const s=await load();photos=Array.isArray(s)?s.filter(p=>p.blob||!['coast','mountains','city','night','forest'].includes(p.kind)):defaults();nextId=photos.reduce((m,p)=>Math.max(m,p.id+1),0);render()})();

/* ---- Online (Supabase) storage ---- */
async function load(){try{const r=await fetch(SB+'/rest/v1/photos?select=*&order=date.desc.nullslast,created_at.desc',{headers:H});if(!r.ok)throw 0;const rows=await r.json();let favs=[];try{favs=JSON.parse(localStorage.getItem('favs')||'[]')}catch(e){}
  return rows.map(x=>({id:x.id,title:x.title,desc:x.description||'',album:x.album||'Unsorted',date:x.date||'',fav:favs.includes(x.id),_src:x.url}))}catch(e){return[]}}
function save(){try{localStorage.setItem('favs',JSON.stringify(photos.filter(p=>p.fav).map(p=>p.id)))}catch(e){}}
let queue=[],draft=null;
function addFiles(fs){[...fs].forEach(f=>{if(f.type.startsWith('image/'))queue.push(f)});nextDraft()}
function nextDraft(){if(!queue.length||draft)return;const f=queue.shift();
  draft={id:-1,blob:f,_src:URL.createObjectURL(f),title:f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' '),desc:'',album:'My uploads',date:new Date().toISOString().slice(0,10),fav:false};
  shown=[draft];cur=0;document.body.classList.add('drafting');setEdit(true);showLb();pop();if(!$('lb').open)$('lb').showModal()}
async function shrink(f){try{const bm=await createImageBitmap(f),s=Math.min(1,1800/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||f),'image/jpeg',.85))}catch(e){return f}}
$('pub').onclick=async()=>{const d=draft,b=$('pub');if(!d)return;b.disabled=true;b.textContent='Publishing...';
  try{const blob=await shrink(d.blob),ext=(blob.type.split('/')[1]||'jpg').replace('jpeg','jpg').replace(/[^a-z0-9]/g,''),path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
    const u=await fetch(SB+'/storage/v1/object/photos/'+path,{method:'POST',headers:{...H,'Content-Type':blob.type||'image/jpeg'},body:blob});if(!u.ok)throw 0;
    const url=SB+'/storage/v1/object/public/photos/'+path;
    const r=await fetch(SB+'/rest/v1/photos',{method:'POST',headers:{...H,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({title:d.title||'Untitled',description:d.desc,album:d.album||'Unsorted',date:d.date||null,url})});if(!r.ok)throw 0;
    const row=(await r.json())[0];photos.unshift({id:row.id,title:d.title||'Untitled',desc:d.desc,album:d.album||'Unsorted',date:d.date,fav:false,_src:url});draft=null;$('lb').close()}
  catch(e){alert('Upload failed. Please check the setup steps and try again.')}
  b.disabled=false;b.textContent='Publish photo'};
$('lb').addEventListener('close',()=>{draft=null;document.body.classList.remove('drafting');nextDraft()});

/* ---- Big hover preview ---- */
const peek=document.createElement('div');peek.id='peek';peek.innerHTML='<img alt=""><div class="pt"><b></b><p></p></div>';document.body.appendChild(peek);
function peekPlace(c){const im=peek.querySelector('img'),r=c.getBoundingClientRect(),maxW=Math.min(680,innerWidth*.55),maxH=innerHeight*.72;
  if(im.naturalWidth>0){const s=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight);im.style.width=Math.round(im.naturalWidth*s)+'px'}
  const w=peek.offsetWidth,h=peek.offsetHeight;let x=r.right+14;if(x+w>innerWidth-8)x=r.left-14-w;if(x<8)x=Math.max(8,(innerWidth-w)/2);
  const y=Math.max(8,Math.min(r.top+r.height/2-h/2,innerHeight-h-8));peek.style.left=x+'px';peek.style.top=y+'px'}
function peekShow(c,p){const im=peek.querySelector('img');peek.querySelector('b').textContent=p.title;peek.querySelector('p').textContent=p.desc||'';
  peek.classList.add('on');im.onload=()=>peekPlace(c);const s=c.querySelector('img').src;if(im.src!==s){im.style.width='';im.src=s}peekPlace(c)}
function peekHide(){peek.classList.remove('on')}
addEventListener('scroll',peekHide,{passive:true});document.addEventListener('click',peekHide);
</script>
